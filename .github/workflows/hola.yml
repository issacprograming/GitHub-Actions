name: hola mundo

on: 
  push:
  workflow_dispatch:
    inputs:
      saludo:
        type: choice
        options: [Hola, buenas, qué tal]         
        

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chechokut@v4
      - run: echo "Hola mundo ${{ github.actor }}, commit ${{ github.sha }}
      - run: echo "Elegiste: ${{ inputs.saludo }}"

